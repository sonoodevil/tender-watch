name: Daily tender scan
on:
  schedule:
    - cron: "37 1 * * *"    # 06:37 AM Pakistan time, every day
    - cron: "37 9 * * *"    # 02:37 PM Pakistan time (second sweep)
  workflow_dispatch:
  push:
    paths: ["run-now.txt"]
permissions:
  contents: write
concurrency: { group: scrape, cancel-in-progress: false }
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python scraper.py
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          WA_TO: ${{ secrets.WA_TO }}
          FORCE_NOTIFY: ${{ github.event_name != 'schedule' && '1' || '' }}
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
          WA_PHONE_ID: ${{ secrets.WA_PHONE_ID }}
          WA_TEMPLATE: ${{ secrets.WA_TEMPLATE }}
          CALLMEBOT_KEY: ${{ secrets.CALLMEBOT_KEY }}
      - name: Save results
        run: |
          git config user.name "tender-bot"
          git config user.email "tender-bot@users.noreply.github.com"
          git add tenders.json
          git diff --staged --quiet || (git commit -m "Tender scan $(date -u +'%F %H:%M')" && git push)
