name: Daily tender scan
on:
  schedule:
    - cron: "37 1 * * *"    # 06:37 AM Pakistan time, every day
    - cron: "37 9 * * *"    # 02:37 PM Pakistan time (second sweep)
  workflow_dispatch:
  push:
    paths: ["run-now.txt"]
permissions:
  contents: write
concurrency: { group: scrape, cancel-in-progress: false }
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python scraper.py
        env:
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          GMAIL_USER: ${{ secrets.GMAIL_USER || vars.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS || vars.GMAIL_APP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL || vars.NOTIFY_EMAIL }}
          WA_TO: ${{ secrets.WA_TO || vars.WA_TO }}
          FORCE_NOTIFY: ${{ github.event_name != 'schedule' && '1' || '' }}
          WA_TOKEN: ${{ secrets.WA_TOKEN || vars.WA_TOKEN }}
          WA_PHONE_ID: ${{ secrets.WA_PHONE_ID || vars.WA_PHONE_ID }}
          WA_TEMPLATE: ${{ secrets.WA_TEMPLATE || vars.WA_TEMPLATE }}
          CALLMEBOT_KEY: ${{ secrets.CALLMEBOT_KEY || vars.CALLMEBOT_KEY }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO || vars.WHATSAPP_TO }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE || vars.WHATSAPP_PHONE }}
          WHATSAPP_NUMBER: ${{ secrets.WHATSAPP_NUMBER || vars.WHATSAPP_NUMBER }}
          WHATSAPP_NUMBERS: ${{ secrets.WHATSAPP_NUMBERS || vars.WHATSAPP_NUMBERS }}
          WA_PHONE: ${{ secrets.WA_PHONE || vars.WA_PHONE }}
          WA_NUMBER: ${{ secrets.WA_NUMBER || vars.WA_NUMBER }}
          WA_NUMBERS: ${{ secrets.WA_NUMBERS || vars.WA_NUMBERS }}
          PHONE: ${{ secrets.PHONE || vars.PHONE }}
          PHONE_NUMBER: ${{ secrets.PHONE_NUMBER || vars.PHONE_NUMBER }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN || vars.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID || vars.WHATSAPP_PHONE_ID }}
          WHATSAPP_TEMPLATE: ${{ secrets.WHATSAPP_TEMPLATE || vars.WHATSAPP_TEMPLATE }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY || vars.CALLMEBOT_API_KEY }}
          CALLMEBOT: ${{ secrets.CALLMEBOT || vars.CALLMEBOT }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD || vars.GMAIL_APP_PASSWORD }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS || vars.GMAIL_PASS }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD || vars.GMAIL_PASSWORD }}
          NOTIFY_EMAILS: ${{ secrets.NOTIFY_EMAILS || vars.NOTIFY_EMAILS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO || vars.EMAIL_TO }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL || vars.ALERT_EMAIL }}
      - name: Save results
        run: |
          git config user.name "tender-bot"
          git config user.email "tender-bot@users.noreply.github.com"
          git add tenders.json
          git diff --staged --quiet || (git commit -m "Tender scan $(date -u +'%F %H:%M')" && git push)
